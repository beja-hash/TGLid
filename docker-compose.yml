services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env before starting}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env before starting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env before starting}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tglid_internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    networks:
      - tglid_internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Copy .env.example to .env before starting}
      REDIS_URL: ${REDIS_URL:?Copy .env.example to .env before starting}
    ports:
      - "8000:8000"
    networks:
      - tglid_internal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Copy .env.example to .env before starting}
        NEXT_PUBLIC_CSRF_COOKIE_NAME: ${NEXT_PUBLIC_CSRF_COOKIE_NAME:-tglid_csrf}
        NEXT_PUBLIC_CSRF_HEADER_NAME: ${NEXT_PUBLIC_CSRF_HEADER_NAME:-X-CSRF-Token}
    ports:
      - "3000:3000"
    networks:
      - tglid_internal
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  api-test:
    profiles: ["test"]
    build:
      context: ./apps/api
      dockerfile: Dockerfile.test
    env_file: .env
    environment:
      APP_ENV: test
      DATABASE_URL: ${TEST_DATABASE_URL:?Add TEST_DATABASE_URL to .env}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:?Add TEST_DATABASE_URL to .env}
      REDIS_URL: redis://redis:6379/15
      SESSION_COOKIE_SECURE: "false"
    networks:
      - tglid_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  tglid_internal:
    driver: bridge
