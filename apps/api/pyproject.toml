[project]
name = "tglid-api"
version = "0.1.0"
description = "Infrastructure API for TGLid"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2.0",
  "argon2-cffi>=25.1,<26.0",
  "asyncpg>=0.30,<1.0",
  "cryptography>=45,<47",
  "email-validator>=2.2,<3.0",
  "fastapi>=0.116,<1.0",
  "greenlet>=3.2,<4.0",
  "pydantic-settings>=2.10,<3.0",
  "redis>=6.2,<7.0",
  "sqlalchemy>=2.0,<3.0",
  "telethon>=1.42,<2.0",
  "uvicorn[standard]>=0.35,<1.0"
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.17,<2.0",
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.1,<2.0",
  "ruff>=0.12,<1.0"
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["integration: requires the isolated PostgreSQL and Redis test services"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["telethon", "telethon.*"]
ignore_missing_imports = true
